{% extends 'blog/base.html' %}
{% block content %}
    {% for heroi in herois %}
        <div class="col-md-4 offset-4 text-center mt-3">
            <div class="card mb-3">
            <div class="card-body">
                <h5 class="card-title">{{ heroi.username }}</h5>
                <p class="card-text">{{ heroi.poderes }}</p>
                <small class="text-muted">{{ heroi.cidade }}</small>
            </div>
            </div>
        </div>
    {% endfor %}
{% endblock content %}
