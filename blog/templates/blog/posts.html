{% extends 'blog/base.html' %}
{% block content %}
<ul class="list-group-flush mt-3">
    {% for post in posts %}
    <li class="list-group-item col-md-8 offset-2 pt-3">
        <h1>{{post.titulo}}</h1>
        <h2>Autor: {{ post.autor }}</h2>
        {{post.texto}}<br><hr>
    </li>
    {% endfor %}
</ul>
{% endblock content %}
