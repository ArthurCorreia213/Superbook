{% extends "blog/base.html" %}
{% load crispy_forms_tags %}
{% block content %}
    <div class="content-section col-md-8 offset-2">
        <form method="POST">
            {% csrf_token %}
            <fieldset class="form-group">
                <legend class="border-bottom mb-4">Editar post</legend>
                {{ object.titulo }}
            </fieldset>
            <div class="form-group">
                <button class="btn btn-outline-info" type="submit">Confirmar</button>
            </div>
        </form>
    </div>
{% endblock content %}
